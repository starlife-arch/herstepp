name: Reconcile PrintPay seller payouts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: printpay-payout-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Poll PrintPay payout statuses
        env:
          CRON_SECRET: ${{ secrets.HERSTEP_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing GitHub Actions secret HERSTEP_CRON_SECRET."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "https://www.herstepcollection.shop/api/cron/printpay-payouts"
